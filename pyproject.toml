[project]
name = "pdf-invoice-api"
version = "0.1.0"
description = "API Python para extrair texto de invoices em PDF usando Apache PDFBox."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "openai>=1.93.0",
  "pdfplumber>=0.11.0",
  "pillow>=10.0.0",
  "pypdfium2>=4.30.0",
  "pytesseract>=0.3.13",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
