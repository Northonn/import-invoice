services:
  - type: web
    name: pdf-invoice-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: API_KEY
        generateValue: true
      - key: MAX_UPLOAD_MB
        value: "25"
      - key: PDFBOX_TIMEOUT_SECONDS
        value: "60"
      - key: OPENAI_MODEL
        value: "gpt-4.1-mini"
      - key: OCR_ENABLED
        value: "true"
      - key: OCR_LANGUAGE
        value: "eng+por"
      - key: OCR_DPI
        value: "200"
      - key: OCR_MAX_PAGES
        value: "5"
      - key: MIN_TEXT_CHARS_FOR_OCR
        value: "80"
